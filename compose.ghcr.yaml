# Runs the prebuilt image from GitHub Container Registry; nothing is built locally.
#   docker compose -f compose.ghcr.yaml up -d
# Pin a release with GIT_KEEPR_VERSION (e.g. in your shell or an .env next to this file):
#   GIT_KEEPR_VERSION=0.1.0 docker compose -f compose.ghcr.yaml up -d
services:
  git-keepr:
    image: ghcr.io/amirkode/git-keepr:${GIT_KEEPR_VERSION:-latest}
    container_name: git-keepr
    restart: unless-stopped
    init: true
    command: ["serve", "--config", "/etc/git-keepr/config.yaml"]
    env_file:
      - .env
    volumes:
      - ./config.yaml:/etc/git-keepr/config.yaml:ro
      - git_keepr_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  git_keepr_data:
