<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Meme: a smug child calmly roasts a marshmallow on a burning house labelled github.com/me/everything while holding a small server that says git-keepr, all repos mirrored. Top: GitHub account got suspended. Bottom: Me remembering I have git-keepr running on my server.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22142f"/><stop offset="0.5" stop-color="#b53c1c"/><stop offset="1" stop-color="#f6a431"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffe066"/><stop offset="0.5" stop-color="#ff7a1a"/><stop offset="1" stop-color="#d7261e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf5a" stop-opacity="0.75"/><stop offset="1" stop-color="#ffcf5a" stop-opacity="0"/>
    </radialGradient>
    <style>
      .meme { font-family: Impact, 'Arial Black', 'DejaVu Sans', sans-serif; font-weight: 900; fill: #fff; stroke: #000;
              stroke-width: 7px; paint-order: stroke fill; stroke-linejoin: round; text-anchor: middle; }
      .mono { font-family: 'DejaVu Sans Mono', Menlo, Consolas, monospace; }
      .lbl  { font-family: 'DejaVu Sans', Arial, sans-serif; font-weight: 700; }
    </style>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <ellipse cx="560" cy="360" rx="330" ry="230" fill="url(#glow)"/>

  <!-- smoke -->
  <g fill="#1b1220" opacity="0.6">
    <ellipse cx="610" cy="150" rx="130" ry="46"/><ellipse cx="690" cy="104" rx="95" ry="38"/>
    <ellipse cx="520" cy="120" rx="95" ry="36"/><ellipse cx="640" cy="196" rx="80" ry="28"/>
  </g>
  <!-- embers -->
  <g fill="#ffd966">
    <circle cx="470" cy="230" r="3"/><circle cx="520" cy="190" r="2.5"/><circle cx="600" cy="215" r="3"/>
    <circle cx="700" cy="240" r="2.5"/><circle cx="745" cy="200" r="3"/><circle cx="560" cy="160" r="2"/>
  </g>

  <!-- ground -->
  <rect y="488" width="800" height="112" fill="#2b261f"/>

  <!-- the house -->
  <g transform="translate(440,210)">
    <rect x="0" y="95" width="320" height="185" fill="#ecdcc0" stroke="#111" stroke-width="4"/>
    <polygon points="-22,98 160,-14 342,98" fill="#7a2f22" stroke="#111" stroke-width="4"/>
    <!-- sign on the wall -->
    <rect x="52" y="106" width="216" height="40" rx="4" fill="#24292f" stroke="#111" stroke-width="3"/>
    <text x="160" y="132" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="#e6edf3">github.com/me/everything</text>
    <rect x="132" y="190" width="56" height="90" fill="#4a2c1a" stroke="#111" stroke-width="3"/>
    <rect x="28" y="160" width="62" height="56" fill="#1b1220" stroke="#111" stroke-width="3"/>
    <rect x="230" y="160" width="62" height="56" fill="#1b1220" stroke="#111" stroke-width="3"/>
    <!-- 403 on the door -->
    <rect x="136" y="160" width="48" height="24" rx="3" fill="#b3261e" stroke="#111" stroke-width="2"/>
    <text x="160" y="178" text-anchor="middle" class="lbl" font-size="16" fill="#fff">403</text>
    <!-- flames -->
    <g fill="url(#flame)" stroke="#8a1a10" stroke-width="2">
      <path d="M28,216 C30,190 46,198 48,168 C60,190 74,180 70,200 C84,192 92,204 90,216 Z"/>
      <path d="M230,216 C234,188 250,198 254,166 C266,188 280,180 276,200 C290,192 296,204 292,216 Z"/>
      <path d="M124,282 C120,244 146,254 148,208 C164,242 188,228 182,258 C198,250 212,266 208,282 Z"/>
      <path d="M-4,104 C4,60 38,80 44,26 C66,70 92,52 84,96 C112,72 132,100 120,104 Z"/>
      <path d="M200,104 C208,52 240,78 250,14 C270,64 296,46 290,100 C318,82 338,104 326,108 Z"/>
      <path d="M96,100 C100,70 120,84 126,52 C140,84 156,76 152,100 Z"/>
    </g>
    
  </g>

  <!-- flying "account suspended" email -->
  <g transform="translate(405,92) rotate(-12)">
    <rect width="150" height="82" rx="6" fill="#fff" stroke="#111" stroke-width="3"/>
    <path d="M0,0 L75,48 L150,0" fill="none" stroke="#111" stroke-width="3"/>
    <text x="75" y="64" text-anchor="middle" class="lbl" font-size="11" fill="#b3261e">Your account has been</text>
    <text x="75" y="77" text-anchor="middle" class="lbl" font-size="11" fill="#b3261e">suspended. :)</text>
  </g>

  <!-- the kid -->
  <g transform="translate(170,372)">
    <!-- body -->
    <path d="M-95,230 C-95,138 -62,104 0,104 C62,104 95,138 95,230 Z" fill="#3b7fd0" stroke="#111" stroke-width="4"/>
    <!-- right arm, marshmallow stick towards the fire -->
    <path d="M70,130 C110,128 140,118 168,98" stroke="#3b7fd0" stroke-width="26" fill="none" stroke-linecap="round"/>
    <path d="M70,130 C110,128 140,118 168,98" stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" opacity="0"/>
    <circle cx="176" cy="94" r="13" fill="#f6cfa8" stroke="#111" stroke-width="3"/>
    <line x1="180" y1="92" x2="300" y2="40" stroke="#6b4423" stroke-width="4" stroke-linecap="round"/>
    <rect x="292" y="22" width="26" height="22" rx="9" fill="#f4e7d2" stroke="#6b4423" stroke-width="2" transform="rotate(-24 305 33)"/>
    <path d="M296,22 q9,-18 14,0 q4,-10 8,2" fill="#ff7a1a" stroke="none"/>
    <!-- neck -->
    <rect x="-20" y="64" width="40" height="48" fill="#f0c19a" stroke="#111" stroke-width="3"/>
    <!-- hair back -->
    <path d="M-80,-6 C-94,-96 94,-96 80,-6 C86,46 72,78 62,84 L-62,84 C-74,78 -86,46 -80,-6 Z" fill="#6b3d1e" stroke="#111" stroke-width="4"/>
    <!-- face -->
    <ellipse cx="0" cy="6" rx="64" ry="72" fill="#f6cfa8" stroke="#111" stroke-width="4"/>
    <path d="M-66,-12 C-42,-70 32,-80 66,-14 C42,-42 0,-48 -66,-12 Z" fill="#6b3d1e" stroke="#111" stroke-width="3"/>
    <!-- eyes: looking right at the camera, raised brow -->
    <ellipse cx="-24" cy="2" rx="14" ry="10" fill="#fff" stroke="#111" stroke-width="3"/>
    <ellipse cx="25" cy="2" rx="14" ry="10" fill="#fff" stroke="#111" stroke-width="3"/>
    <circle cx="-18" cy="3" r="5.5" fill="#111"/><circle cx="31" cy="3" r="5.5" fill="#111"/>
    <path d="M-44,-18 q20,-10 38,3" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M8,-15 q22,-22 40,-6" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- smirk -->
    <path d="M-26,46 q24,14 52,-10" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="-36" cy="30" r="7" fill="#f09a8a" opacity="0.6"/><circle cx="40" cy="26" r="7" fill="#f09a8a" opacity="0.6"/>
    <!-- left arm holds the little server -->
    <path d="M-70,150 C-96,170 -100,190 -92,206" stroke="#3b7fd0" stroke-width="26" fill="none" stroke-linecap="round"/>
  </g>

  <!-- the tiny home server -->
  <g transform="translate(40,500) rotate(-4)">
    <ellipse cx="62" cy="-10" rx="100" ry="70" fill="url(#glow)" opacity="0.5"/>
    <rect width="124" height="64" rx="6" fill="#2d333b" stroke="#111" stroke-width="3"/>
    <rect x="8" y="8" width="108" height="18" rx="3" fill="#161b22"/>
    <text x="62" y="21" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#3fb950">git-keepr ✓ 87/87</text>
    <circle cx="16" cy="44" r="4" fill="#3fb950"/><circle cx="30" cy="44" r="4" fill="#3fb950"/>
    <rect x="62" y="38" width="48" height="12" rx="2" fill="#161b22"/>
    <text x="86" y="48" text-anchor="middle" class="mono" font-size="8" fill="#8b949e">S3 healthy</text>
  </g>

  <!-- captions -->
  <text class="meme" font-size="40" x="400" y="58">GitHub account got suspended.</text>
  <text class="meme" font-size="31" x="400" y="548">Me remembering I have</text>
  <text class="meme" font-size="31" x="400" y="586">git-keepr running on my server</text>
</svg>
