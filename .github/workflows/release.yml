name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - {goos: linux,  goarch: amd64}
          - {goos: linux,  goarch: arm64}
          - {goos: darwin, goarch: amd64}
          - {goos: darwin, goarch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          commit="$(git rev-parse --short=12 HEAD)"
          epoch="$(git log -1 --format=%ct)"
          stage="git-keepr_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${stage}/deploy" "dist/${stage}/scripts"
          go build -trimpath \
            -ldflags "-s -w -X github.com/amirkode/git-keepr/internal/cli.Version=${tag} -X github.com/amirkode/git-keepr/internal/cli.Commit=${commit}" \
            -o "dist/${stage}/git-keepr" ./cmd/git-keepr
          cp README.md LICENSE config.example.yaml .env.example "dist/${stage}/"
          cp deploy/git-keepr.service "dist/${stage}/deploy/"
          cp scripts/install.sh "dist/${stage}/scripts/"
          # deterministic archive: sorted names, fixed mtime/owner, no gzip timestamp
          tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
              -C dist -cf - "${stage}" | gzip -n -9 > "dist/${stage}.tar.gz"
      - name: Smoke-test the archive (linux/amd64 can run on this runner)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p /tmp/verify && tar -xzf "dist/git-keepr_${version}_linux_amd64.tar.gz" -C /tmp/verify
          "/tmp/verify/git-keepr_${version}_linux_amd64/git-keepr" version | tee /dev/stderr | grep -q "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload assets; nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum git-keepr_*.tar.gz | tee checksums.txt
          sha256sum -c checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          flags=()
          case "$tag" in *-*) flags+=(--prerelease) ;; esac
          cat > notes.md <<NOTES
          ## git-keepr ${tag}

          Standalone Linux and macOS binaries (static, \`CGO_ENABLED=0\`) and a multi-architecture container image.

          - Container: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/git-keepr:${version}\`
          - Verify downloads: \`sha256sum -c checksums.txt\`
          - Linux hosts: extract the archive and run \`sudo scripts/install.sh --binary ./git-keepr --config ./config.yaml\`

          Scope reminder: git-keepr backs up Git history reachable from fetched refs. Git LFS payloads, issues, PRs, releases, wikis and submodule contents are not included.
          NOTES
          gh release create "$tag" dist/git-keepr_*.tar.gz dist/checksums.txt \
            --title "git-keepr ${tag}" --notes-file notes.md --generate-notes --verify-tag "${flags[@]}"

  docker:
    name: Publish container image (GHCR)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GitHub Container Registry with the workflow token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name (registry paths must be lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/git-keepr" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only non-secret build metadata is passed.
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
